<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-label="Alauddin leaping across moonlit rooftops with his falcon Saqr, the glowing brass lamp below and the Vizier's tower looming in the distance">
  <defs>
    <linearGradient id="nightsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060824"/><stop offset=".55" stop-color="#2a1a5a"/><stop offset="1" stop-color="#a8406a"/>
    </linearGradient>
    <radialGradient id="moonglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff4d8" stop-opacity=".9"/><stop offset="1" stop-color="#fff4d8" stop-opacity="0"/></radialGradient>
    <radialGradient id="lampglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".95"/><stop offset="1" stop-color="#ff9a3a" stop-opacity="0"/></radialGradient>
  </defs>
  <g stroke="#1b1530" stroke-linejoin="round" stroke-linecap="round">
    <rect width="1600" height="640" fill="url(#nightsky)" stroke="none"/>
    <g fill="#fff" stroke="none" opacity=".85">
      <circle cx="120" cy="70" r="2.4"/><circle cx="260" cy="110" r="1.8"/><circle cx="420" cy="50" r="2"/><circle cx="560" cy="130" r="1.6"/>
      <circle cx="700" cy="70" r="2.2"/><circle cx="90" cy="200" r="1.6"/><circle cx="980" cy="60" r="1.8"/><circle cx="1120" cy="40" r="2"/>
    </g>
    <circle cx="1310" cy="110" r="70" fill="url(#moonglow)" stroke="none"/>
    <circle cx="1310" cy="110" r="46" fill="#fff4d8" stroke-width="3"/><circle cx="1326" cy="98" r="38" fill="#2a1a5a" stroke="none"/>
    <!-- Vizier's tower, far background, story threat -->
    <g opacity=".8">
      <rect x="1420" y="260" width="60" height="230" fill="#1a0e36" stroke-width="3"/>
      <path d="M1410 260 L1450 190 L1490 260Z" fill="#4a0e18" stroke-width="3"/>
      <circle cx="1450" cy="310" r="10" fill="#ff5a5a" stroke-width="2"/>
    </g>
    <!-- Qasr al-Nur skyline -->
    <g fill="#241548" stroke-width="3">
      <rect x="40" y="340" width="150" height="190"/><path d="M28 340 Q115 300 202 340Z"/>
      <rect x="230" y="300" width="60" height="230"/><path d="M220 300 Q260 260 300 300Z"/>
      <rect x="1230" y="330" width="150" height="200"/><path d="M1218 330 Q1305 288 1392 330Z"/>
      <rect x="-20" y="380" width="110" height="150"/>
      <rect x="1050" y="390" width="70" height="140"/><path d="M1040 390 Q1085 356 1130 390Z"/>
    </g>
    <g fill="#ffd27a" stroke="none" opacity=".75">
      <rect x="70" y="380" width="14" height="18"/><rect x="100" y="420" width="14" height="18"/><rect x="150" y="390" width="14" height="18"/>
      <rect x="250" y="340" width="12" height="16"/><rect x="1270" y="370" width="14" height="18"/><rect x="1310" y="410" width="14" height="18"/>
    </g>
    <path d="M0 530 Q400 500 800 520 T1600 520 V640 H0Z" fill="#1a1032" stroke="none"/>
    <!-- Brass lamp, glowing, foreground left -->
    <circle cx="260" cy="470" r="80" fill="url(#lampglow)" stroke="none"/>
    <g transform="translate(260 480) scale(5.2)">
      <ellipse cx="0" cy="1" rx="5" ry="2.6" fill="#e0a820" stroke-width="1"/>
      <path d="M4 0 L9 -3 L8 -1 L4 2Z" fill="#e0a820" stroke-width="1"/>
      <rect x="-1" y="-2" width="2" height="2" fill="#e0a820" stroke-width="1"/><rect x="-3" y="3" width="6" height="1" fill="#a07010" stroke-width="1"/>
      <path d="M-5 -2 A2 2 0 0 0 -5 2" stroke="#e0a820" stroke-width="1" fill="none"/>
    </g>
    <g fill="#5ff5e0" stroke="none" opacity=".8">
      <circle cx="300" cy="420" r="4"/><circle cx="318" cy="390" r="3"/><circle cx="330" cy="360" r="2.2"/>
    </g>
    <!-- Saqr the falcon -->
    <g transform="translate(980 220) scale(2.4)">
      <path d="M-9 -7 L-18 -13 L-13 -2 L-6 -6Z" fill="#8a5424" stroke-width="2"/>
      <circle cx="0" cy="-6" r="6.2" fill="#a8743a" stroke-width="2.2"/><circle cx="1" cy="-5" r="4.4" fill="#f4e2c0" stroke-width="2"/>
      <circle cx="2" cy="-12.5" r="4.8" fill="#a8743a" stroke-width="2.2"/>
      <circle cx="3.9" cy="-13" r="2" fill="#fff" stroke-width="1.5"/><circle cx="4.4" cy="-12.9" r="1.15" fill="#1a0a00" stroke="none"/>
      <path d="M6 -12.4 L9.4 -11 L6.8 -9.8Z" fill="#ffc23a" stroke-width="1"/>
      <path d="M-1 -8 L-7.5 -3.6 L1 -3Z" fill="#c0864a" stroke-width="2"/>
    </g>
    <!-- Zahir, mid-leap, hero moment -->
    <g transform="translate(760 300) scale(3.0)">
      <path d="M-4.6 -17.2 L4.6 -17.2 L4.6 -7.8 L-4.6 -7.8Z" fill="#f3ead6" stroke-width="1.6"/>
      <path d="M-4.6 -17.2 L-1 -17.2 L-1 -7.8 L-4.6 -7.8Z" fill="#b8283a" stroke-width="1.2"/>
      <path d="M1.6 -17.2 L4.6 -17.2 L4.6 -7.8 L1.6 -7.8Z" fill="#b8283a" stroke-width="1.2"/>
      <path d="M-5 -10.2 L5 -10.2 L5 -7.8 L-5 -7.8Z" fill="#e8742f" stroke-width="1.2"/>
      <path d="M-5.2 -2 L-2.2 -2 L-3 10 L-6 10Z" fill="#2e4f9a" stroke-width="1.2"/>
      <path d="M5.2 -2 L2.2 -2 L3.6 10 L6.6 10Z" fill="#2e4f9a" stroke-width="1.2"/>
      <circle cx="0" cy="-20.5" r="4.6" fill="#d39463" stroke-width="1.5"/>
      <path d="M-4.4 -27 L4.6 -27 L4.6 -22.8 L-4.4 -22.8Z" fill="#1aa596" stroke-width="1.3"/>
      <circle cx="3.2" cy="-25.2" r="1.4" fill="#f0c040" stroke-width="1"/>
      <path d="M-7.4 -26 L-11.4 -23 L-7.4 -21Z" fill="#1aa596" stroke-width="1.2"/>
