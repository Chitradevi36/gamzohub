        <path d="M3 -1.2 Q12 -3 18 -7 Q13 1.2 3 1.4Z" fill="#e6ecf4" stroke-width="1.2"/>
      </g>
    </g>
    <g fill="#5ff5e0" stroke="none" opacity=".85">
      <path d="M840 240 q-6 -10 0 -18"/><path d="M856 236 q-6 -10 0 -18"/>
    </g>
    <path d="M620 340 Q700 300 790 310" fill="none" stroke="#efe9fb" stroke-width="4" stroke-dasharray="2 12" opacity=".7"/>
  </g>
</svg>
