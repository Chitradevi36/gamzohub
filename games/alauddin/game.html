<script>
'use strict';
// =============================================================
//  ALAUDDIN AND THE BRASS LAMP  —  an original Arabian Nights platformer
// =============================================================
const TS=16, VH=270, GRAV=0.38, MAXF=7.5;
let VW=480, Z=1, viewW=480, viewH=270, baseZ=1, HS=1;
const cv=document.getElementById('c'); let ctx=cv.getContext('2d'); const MAINCTX=ctx;
function setZoom(){ Z=baseZ; if(L&&L.def.boss) Z=Math.min(baseZ,VW/480); viewW=VW/Z; viewH=VH/Z; }
let K=2;
const FONT='"Press Start 2P", monospace';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const inR=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=(a,b)=>a+Math.random()*(b-a);

// ---------------- SAVE ----------------
let SAVE={unlocked:0,best:{},muted:false,tips:{},seenCast:false};
try{const s=JSON.parse(localStorage.getItem('zahir_lamp_v3')||'null'); if(s) SAVE=Object.assign(SAVE,s);}catch(e){}
function save(){try{localStorage.setItem('zahir_lamp_v3',JSON.stringify(SAVE));}catch(e){}}

// ---------------- INPUT ----------------
const ACTS=['left','right','up','down','jump','slash','throw','roll','djinn','pause','confirm','mute'];
const keys={}, latch={}, I={}, PI={};
ACTS.forEach(a=>{I[a]=false;PI[a]=false;});
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowDown:'down',KeyS:'down',ArrowUp:'up',KeyW:'up',Space:'jump',KeyZ:'jump',KeyJ:'slash',KeyX:'slash',KeyK:'throw',KeyC:'throw',KeyL:'roll',ShiftLeft:'roll',ShiftRight:'roll',KeyE:'djinn',KeyP:'pause',Escape:'pause',Enter:'confirm',KeyM:'mute'};
addEventListener('keydown',e=>{const a=KEYMAP[e.code]; if(a){ if(!keys[a]) latch[a]=true; keys[a]=true; e.preventDefault(); } initAudio();});
addEventListener('keyup',e=>{const a=KEYMAP[e.code]; if(a) keys[a]=false;});
let touchSet=new Set(); const taps=[]; let isTouch=false;
const BTN={L:'left',R:'right',U:'up',D:'down',J:'jump',A:'slash',T:'throw',Ro:'roll',Dj:'djinn'};
const btnEls={}; for(const id in BTN) btnEls[id]=document.getElementById('b'+id);
const touchEl=document.getElementById('touch');
function toLogical(cx,cy){const r=cv.getBoundingClientRect();return{x:(cx-r.left)/r.width*VW,y:(cy-r.top)/r.height*VH};}
function handleTouches(e){
  e.preventDefault(); if(!isTouch){isTouch=true; layoutTouch();} initAudio();
  const s=new Set();
  if(touchEl.classList.contains('on')){
    for(const t of e.touches){
      for(const id in BTN){ const el=btnEls[id]; if(el.style.display==='none') continue;
        const r=el.getBoundingClientRect(); const pad=(id==='L'||id==='R')?16:8;
        if(t.clientX>=r.left-pad&&t.clientX<=r.right+pad&&t.clientY>=r.top-pad&&t.clientY<=r.bottom+pad) s.add(BTN[id]);
      }
    }
  }
  for(const a of s) if(!touchSet.has(a)) latch[a]=true;
  touchSet=s; for(const id in btnEls) btnEls[id].classList.toggle('p',s.has(BTN[id]));
  if(e.type==='touchstart') for(const t of e.changedTouches) taps.push(toLogical(t.clientX,t.clientY));
}
['touchstart','touchmove','touchend','touchcancel'].forEach(ev=>addEventListener(ev,handleTouches,{passive:false}));
addEventListener('mousedown',e=>{initAudio(); taps.push(toLogical(e.clientX,e.clientY));});
function pollInput(){
  for(const a of ACTS) PI[a]=I[a];
  for(const a of ACTS) I[a]=!!keys[a]||touchSet.has(a)||!!latch[a];
  for(const a in latch) latch[a]=false;
  try{ const gps=navigator.getGamepads?navigator.getGamepads():[]; for(const gp of gps){ if(!gp) continue; const b=i=>gp.buttons[i]&&gp.buttons[i].pressed;
    if(gp.axes[0]<-.4||b(14)) I.left=true; if(gp.axes[0]>.4||b(15)) I.right=true; if(gp.axes[1]>.5||b(13)) I.down=true; if(gp.axes[1]<-.5||b(12)) I.up=true;
    if(b(0)) I.jump=true; if(b(2)) I.slash=true; if(b(1)) I.throw=true; if(b(3)||b(4)) I.roll=true; if(b(5)) I.djinn=true; if(b(9)) I.pause=true; } }catch(e){}
}
const pr=a=>I[a]&&!PI[a];

// ---------------- AUDIO ENGINE ----------------
let AC=null,MG=null,SG=null,MASTER=null,REV=null,noiseBuf=null,MB=null,muted=!!SAVE.muted;
function makeIR(sec,decay){ const len=AC.sampleRate*sec|0, b=AC.createBuffer(2,len,AC.sampleRate); for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); } return b; }
function initAudio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=4; comp.attack.value=.004; comp.release.value=.2; comp.connect(AC.destination);
    MASTER=AC.createGain(); MASTER.gain.value=muted?0:.95; MASTER.connect(comp);
    REV=AC.createConvolver(); REV.buffer=makeIR(2.4,3.2); const rg=AC.createGain(); rg.gain.value=.35; REV.connect(rg); rg.connect(MASTER);
    MG=AC.createGain(); MG.gain.value=.5; MG.connect(MASTER); const ms=AC.createGain(); ms.gain.value=.55; MG.connect(ms); ms.connect(REV);
    SG=AC.createGain(); SG.gain.value=.75; SG.connect(MASTER); const ss=AC.createGain(); ss.gain.value=.2; SG.connect(ss); ss.connect(REV);
    MB=AC.createGain(); MB.connect(MG);
    noiseBuf=AC.createBuffer(1,AC.sampleRate|0,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    mus.next=AC.currentTime+.1; if(mus.track>=0){ const id=mus.track; mus.track=-9; playMusic(id); } }catch(e){AC=null;} }
  if(AC&&AC.state==='suspended') AC.resume().catch(()=>{});
}
function setMute(m){muted=m; SAVE.muted=m; save(); if(MASTER) MASTER.gain.value=m?0:.95;}
function osc(type,f0,f1,dur,vol,dest,t0){ if(!AC) return; const t=t0||AC.currentTime; const o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(dest||SG); o.start(t); o.stop(t+dur+.03); }
function noise(dur,vol,ft,fq,dest,t0,fq2,q){ if(!AC) return; const t=t0||AC.currentTime; const s=AC.createBufferSource(); s.buffer=noiseBuf; s.playbackRate.value=.8+Math.random()*.4; const f=AC.createBiquadFilter(); f.type=ft||'highpass'; f.frequency.setValueAtTime(fq||1000,t); if(fq2) f.frequency.exponentialRampToValueAtTime(fq2,t+dur); if(q) f.Q.value=q;
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f); f.connect(g); g.connect(dest||SG); s.start(t,Math.random()*.5); s.stop(t+dur+.03); }
// ---- instruments ----
function oud(f,t,dur,v,dest){ const lp=AC.createBiquadFilter(), g=AC.createGain(); lp.type='lowpass'; lp.Q.value=5; lp.frequency.setValueAtTime(Math.min(9000,f*9),t); lp.frequency.exponentialRampToValueAtTime(Math.max(250,f*1.4),t+.3);
  for(const [ty,det,gv] of [['sawtooth',-6,.45],['triangle',5,.55],['square',0,.12]]){ const o=AC.createOscillator(); o.type=ty; o.frequency.value=f; o.detune.value=det; const og=AC.createGain(); og.gain.value=gv; o.connect(og); og.connect(lp); o.start(t); o.stop(t+dur+.6); }
  lp.connect(g); g.connect(dest||MB); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(v,t+.003); g.gain.exponentialRampToValueAtTime(v*.3,t+.09); g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.3,dur)+.4); }
function ney(f,t,dur,v,dest){ const o=AC.createOscillator(), o2=AC.createOscillator(), g=AC.createGain(), g2=AC.createGain(), lfo=AC.createOscillator(), lg=AC.createGain();
  o.type='sine'; o2.type='triangle'; o.frequency.value=f; o2.frequency.value=f*2; g2.gain.value=.1; lfo.frequency.value=5.3;
  lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(f*.013,t+Math.min(dur,.4)); lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(dest||MB);
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(v,t+.07); g.gain.setValueAtTime(v*.85,t+Math.max(.08,dur-.04)); g.gain.exponentialRampToValueAtTime(.0001,t+dur+.2);
  for(const x of [o,o2,lfo]){ x.start(t); x.stop(t+dur+.3); }
  noise(Math.min(.14,dur),v*.3,'bandpass',f*2.2,dest||MB,t,0,6); }
function qanun(f,t,v,dest){ const o=AC.createOscillator(), g=AC.createGain(), hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=400; o.type='square'; o.frequency.value=f; o.connect(hp); hp.connect(g); g.connect(dest||MB);
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(v,t+.002); g.gain.exponentialRampToValueAtTime(.0001,t+.35); o.start(t); o.stop(t+.4); }
function bassN(f,t,dur,v){ osc('triangle',f,0,dur,v,MB,t); osc('sine',f*.5,0,dur*.7,v*.9,MB,t); }
function pad(f,t,dur,v){ const lp=AC.createBiquadFilter(), g=AC.createGain(); lp.type='lowpass'; lp.frequency.value=650; lp.connect(g); g.connect(MB);
  for(const fr of [f,f*1.4983,f*1.004]){ const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=fr; o.connect(lp); o.start(t); o.stop(t+dur+1); }
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(v,t+.9); g.gain.setValueAtTime(v,t+Math.max(1,dur-.4)); g.gain.exponentialRampToValueAtTime(.0001,t+dur+.8); }
const dum=(t,v)=>{ osc('sine',118,46,.24,v,MB,t); noise(.03,v*.35,'lowpass',500,MB,t); };
const tek=(t,v)=>{ noise(.06,v,'bandpass',3600,MB,t,0,1.5); osc('sine',2100,1600,.03,v*.25,MB,t); };
const ka=(t,v)=>noise(.035,v,'bandpass',2500,MB,t,0,1.2);
const riq=(t,v)=>{ noise(.12,v,'highpass',7000,MB,t); noise(.06,v*.6,'bandpass',5200,MB,t+.012,0,8); };
// ---- composition ----
const MODES={hijaz:[0,1,4,5,7,8,10],kurd:[0,1,3,5,7,8,10],nahawand:[0,2,3,5,7,8,11],rast:[0,2,4,5,7,9,10]};
const RHY={maqsum:{d:[0,8],t:[2,6,12],k:[4,10,14]},baladi:{d:[0,2,8],t:[6,12],k:[4,10,14]},saidi:{d:[0,6,8],t:[2,12],k:[4,10,14]},
  ayoub:{d:[0,8],t:[6,14],k:[2,4,10,12]},slow:{d:[0],t:[8],k:[12]},none:{d:[],t:[],k:[]}};
const TRACKS={
 0:{mode:'hijaz',root:62,tempo:124,lead:'oud',rhy:'maqsum',riq:1,arp:'qanun'},
 1:{mode:'kurd',root:60,tempo:108,lead:'ney',rhy:'baladi',riq:1,arp:'oud'},
 2:{mode:'nahawand',root:57,tempo:88,lead:'ney',rhy:'slow',riq:0,arp:'qanun'},
 3:{mode:'hijaz',root:62,tempo:148,lead:'oud',rhy:'ayoub',riq:1,arp:'qanun',dbl:1},
 4:{mode:'kurd',root:55,tempo:98,lead:'oud',rhy:'saidi',riq:0,arp:'oud'},
 5:{mode:'nahawand',root:60,tempo:116,lead:'ney',rhy:'maqsum',riq:1,arp:'oud'},
 6:{mode:'hijaz',root:57,tempo:156,lead:'oud',rhy:'ayoub',riq:1,arp:'qanun',dbl:1,boss:1},
 7:{mode:'hijaz',root:62,tempo:80,lead:'ney',rhy:'slow',riq:0,arp:'oud'},
 8:{mode:'rast',root:60,tempo:132,lead:'oud',rhy:'baladi',riq:1,arp:'qanun'},
 9:{mode:'rast',root:57,tempo:104,lead:'ney',rhy:'maqsum',riq:1,arp:'oud'},
 10:{mode:'nahawand',root:62,tempo:112,lead:'oud',rhy:'saidi',riq:1,arp:'qanun'}
};
const mtof=m=>440*2**((m-69)/12);
function deg2m(root,dg,sc){ return root+12*Math.floor(dg/7)+sc[((dg%7)+7)%7]; }
function compose(id){ const cfg=TRACKS[id]||TRACKS[0], r=mulberry(id*7919+17), sc=MODES[cfg.mode];
  const pats=[[4,2,2,4,4],[2,2,2,2,4,4],[3,1,2,2,4,4],[4,4,2,2,4],[6,2,4,4],[2,2,4,2,2,4],[4,2,2,2,2,4]];
  const bar=(start,end)=>{ const p=pats[(r()*pats.length)|0]; const out=[]; let s=0,d=start; p.forEach((len,i)=>{ if(i===p.length-1&&end!=null) d=end; out.push({s,len,n:d,g:len>=4&&r()<.35}); s+=len; const st=r()<.72?(r()<.5?1:-1):(r()<.5?2:-2); d=clamp(d+st,1,11); }); return out; };
  const a1=bar(7,null), a2=bar(a1[a1.length-1].n,4), a2b=bar(a1[a1.length-1].n,7), b1=bar(9,null), b2=bar(b1[b1.length-1].n,5);
  const bars=[a1,a2,a1,a2b,b1,b2,a1,a2b]; const lead=[];
  bars.forEach((b,bi)=>b.forEach(n=>{ const st=bi*16+n.s; (lead[st]=lead[st]||[]).push(n); }));
  return {cfg,sc,root:cfg.root,lead,bassDeg:[0,0,0,0,3,4,0,0],sp:60/cfg.tempo/4,id};
}
const mus={track:-2,seq:null,step:0,next:0};
function playMusic(id){ if(mus.track===id) return; mus.track=id; mus.seq=id<0?null:compose(id); mus.step=0;
  if(AC){ const old=MB; old.gain.setTargetAtTime(0,AC.currentTime,.15); setTimeout(()=>{try{old.disconnect();}catch(e){}},1500); MB=AC.createGain(); MB.connect(MG); mus.next=AC.currentTime+.1; } }
function playStep(i,t){ const s=mus.seq, c=s.cfg, sp=s.sp, bi=i%16, bar=(i/16)|0;
  for(const n of s.lead[i]||[]){ const ins=c.lead==='ney'?ney:oud; const v=c.lead==='ney'?.2:.26; const f=mtof(deg2m(s.root,n.n,s.sc));
    if(n.g){ ins(mtof(deg2m(s.root,n.n+1,s.sc)),t,.07,v*.7); ins(f,t+.07,n.len*sp-.05,v); } else ins(f,t,n.len*sp*.95,v);
    if(c.lead==='oud'&&n.len>=4) oud(f,t+sp*2,sp*2,v*.5); }
  const bd=s.bassDeg[bar];
  if(i%2===0){ const ad=[0,2,4,7,4,2,0,4][(i/2|0)%8]; if(c.arp==='oud'&&i%4===0) oud(mtof(deg2m(s.root-12,bd+ad,s.sc)),t,sp*3,.09); else if(c.arp==='qanun'&&bar>=2) qanun(mtof(deg2m(s.root+12,bd+ad,s.sc)),t,.035); }
  if(bi===0) bassN(mtof(deg2m(s.root-24,bd,s.sc)),t,sp*6,.32); if(bi===8) bassN(mtof(deg2m(s.root-24,bd+4,s.sc)),t,sp*6,.26);
  if(c.boss&&bi%4===2) bassN(mtof(deg2m(s.root-24,bd,s.sc)),t,sp*1.5,.2);
  if(i%64===0){ pad(mtof(s.root-12),t,sp*64,.035); }
  const R=RHY[c.rhy]; if(R.d.includes(bi)) dum(t,.75); if(R.t.includes(bi)) tek(t,.3); if(R.k.includes(bi)) ka(t,.11);
  if(c.dbl&&bi%2===1) ka(t,.06); if(c.riq&&bi%4===2) riq(t,.09); if(c.boss&&bi===12&&bar%2) dum(t,.5); }
setInterval(()=>{ if(!AC||!mus.seq||muted) return; const sp=mus.seq.sp;
  if(mus.next<AC.currentTime-.5) mus.next=AC.currentTime+.05;
  while(mus.next<AC.currentTime+.2){ try{ playStep(mus.step,mus.next); }catch(e){} mus.step=(mus.step+1)%128; mus.next+=sp; } },35);
const now=()=>AC?AC.currentTime:0;
const SFX={
  jump:()=>{ osc('square',260,540,.12,.1); noise(.12,.12,'bandpass',900,null,0,3000,2); },
  djump:()=>{ osc('triangle',520,1040,.14,.14); noise(.18,.12,'bandpass',1500,null,0,6000,3); },
  slash:()=>{ noise(.13,.32,'bandpass',700,null,0,5200,2.5); osc('sine',2400,2300,.09,.04); osc('sine',3700,3600,.06,.03); },
  hit:()=>{ osc('square',190,70,.1,.18); noise(.08,.3,'lowpass',1800); },
  gem:()=>{ [1568,2093,2637].forEach((f,i)=>{ osc('sine',f,0,.25,.13,null,now()+i*.045); osc('triangle',f*2,0,.08,.03,null,now()+i*.045); }); },
  hurt:()=>{ osc('sawtooth',440,90,.32,.2); noise(.2,.2,'lowpass',1200); try{navigator.vibrate&&navigator.vibrate(45);}catch(e){} },
  stomp:()=>{ osc('sine',300,90,.14,.35); osc('square',600,1200,.08,.06); noise(.05,.2,'lowpass',900); },
  throw:()=>noise(.12,.18,'bandpass',600,null,0,2500,3), apple:()=>{ osc('sine',660,990,.08,.14); osc('sine',990,1320,.08,.1,null,now()+.06); },
  boing:()=>{ osc('sine',140,760,.28,.32); osc('triangle',280,1500,.2,.08); },
  kill:()=>{ noise(.22,.28,'lowpass',1400,null,0,200); osc('square',320,50,.18,.1); },
  check:()=>{ [0,4,7,12].forEach((n,i)=>{ if(AC) ney(523*2**(n/12),now()+i*.09,.25,.14,SG); }); },
  djinn:()=>{ osc('sawtooth',180,1400,.7,.13); noise(.8,.2,'bandpass',400,null,0,6000,4); [0,4,7,11,14].forEach((n,i)=>osc('sine',880*2**(n/12),0,.4,.08,null,now()+.15+i*.06)); },
  roar:()=>{ noise(1,.5,'lowpass',500,null,0,120); osc('sawtooth',100,40,1,.3); osc('square',150,60,.8,.08); }, crumble:()=>noise(.35,.25,'lowpass',700,null,0,150),
  sel:()=>{ if(AC) oud(440,now(),.15,.18,SG); }, fire:()=>noise(.25,.16,'bandpass',500,null,0,1600,2),
  win:()=>{ if(!AC) return; [0,4,5,7,8,7,12].forEach((n,i)=>oud(392*2**(n/12),now()+i*.11,.3,.22,SG)); dum(now(),.6); dum(now()+.66,.8); },
  roll:()=>noise(.2,.14,'lowpass',1500,null,0,300), heart:()=>[0,7,12].forEach((n,i)=>osc('sine',520*2**(n/12),0,.18,.13,null,now()+i*.07)),

function tileAt(tx,ty){ if(tx<0||tx>=L.W) return '#'; if(ty<0||ty>=L.H) return '.'; return L.grid[ty][tx]; }

function rectSolid(x,y,w,h){ const x0=Math.floor(x/TS),x1=Math.floor((x+w-.01)/TS),y0=Math.floor(y/TS),y1=Math.floor((y+h-.01)/TS);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty)) return true; return false; }
function colSolid(tx,y0,y1){ for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty)) return true; return false; }
function moveX(o,trim){ o.x+=o.vx; o.hitWall=0; const y0=Math.floor(o.y/TS), y1=Math.floor((o.y+o.h-.01-(trim||0))/TS);

function newGame(i){ G.lives=3; G.apples=8; G.score=0; G.gemBank=0; G.djinn=i>=DJ_LVL?1:0; if(i===0){ G.state='cast'; G.castI=0; G.castT=0; G.castNext=()=>startStory(0); playMusic(7); } else startStory(i); }

// ---------------- TICK ----------------
let titleT=0;
function tick(){
  pollInput(); G.t++;
  if(pr('mute')&&G.state!=='play') setMute(!muted);
  switch(G.state){
    case 'title': titleT++; if(mus.track!==7) playMusic(7); runMenu(menuItems(),122,18); break;
    case 'select': { const n=LEVELS.length; if(pr('right')){G.mapSel=Math.min(n-1,G.mapSel+1);sfx('sel');} if(pr('left')){G.mapSel=Math.max(0,G.mapSel-1);sfx('sel');}
      const go=i=>{ if(i<=SAVE.unlocked){ G.lives=3;G.apples=8;G.score=0;G.gemBank=0;G.djinn=i>=DJ_LVL?1:0; startStory(i);} else sfx('hurt'); };
      if(pr('confirm')||pr('jump')) go(G.mapSel); if(pr('pause')){G.state='title';G.sel=0;}
      for(const tp of taps){ for(let i=0;i<n;i++){ const q=mapNode(i); if(Math.hypot(tp.x-q.x,tp.y-q.y)<17){ if(G.mapSel===i) go(i); else { G.mapSel=i; sfx('sel'); } } }
        if(inR(tp,MAP_PLAY())) go(G.mapSel); if(inR(tp,MAP_BACK())){ G.state='title'; G.sel=0; } } break; }
    case 'cast': { const n=CAST.length; let next=pr('confirm')||pr('jump')||pr('right'), back=pr('left'), skip=pr('pause'); G.castT=(G.castT||0)+1;
      for(const tp of taps){ if(inR(tp,{x:VW-74,y:2,w:72,h:18})) skip=true; else if(tp.x<VW*.25) back=true; else next=true; }
      if(back&&G.castI>0){ G.castI--; G.castT=0; sfx('sel'); } else if(next&&G.castT>8){ G.castI++; G.castT=0; sfx('sel'); }
      if(skip||G.castI>=n){ SAVE.seenCast=true; save(); const f=G.castNext; G.castNext=null; G.castI=0; if(f) f(); else { G.state='title'; G.sel=0; } } break; }
    case 'help': if(pr('confirm')||pr('jump')||pr('pause')||taps.length){ G.state=G.helpBack||'title'; } break;
    case 'story': { const s=G.story, line=s.lines[s.idx]; s.ch=Math.min(line.t.length,s.ch+1.2);
      let adv=pr('confirm')||pr('jump')||pr('slash'); let skip=pr('pause');
      for(const tp of taps){ if(inR(tp,{x:VW-74,y:2,w:72,h:18})) skip=true; else adv=true; }
      if(skip){ s.idx=s.lines.length; } else if(adv){ if(s.ch<line.t.length) s.ch=line.t.length; else { s.idx++; s.ch=0; sfx('sel'); } }
      if(s.idx>=s.lines.length){ if(s.next==='credits'){ G.state='credits'; G.credT=0; playMusic(7); } else beginPlay(); } break; }
    case 'play': updatePlay(); break;
    case 'pause': if(pr('pause')){G.state='play';break;} runMenu(pauseItems(),96,22); break;
    case 'clear': G.clearT++; if(G.clearT>45&&(pr('confirm')||pr('jump')||pr('slash')||taps.length)) afterClear(); break;
    case 'gameover': runMenu(overItems(),150,22); break;
    case 'credits': G.credT++; if(G.credT>120&&(pr('confirm')||pr('jump')||taps.length)||G.credT>1500){ G.state='title'; G.sel=0; } break;
  }
  taps.length=0;
  updateTouchVisibility();
}
let PAUSE_R={x:VW-30,y:0,w:30,h:26}, DJ_R={x:-99,y:-99,w:0,h:0};

  if(L.t===50) say(HINTS[L.i]||'Let\'s go!');

  for(const w of words){ const t=cur?cur+' '+w:w; if(ctx.measureText(t).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=t; } if(cur) lines.push(cur); return lines; }
