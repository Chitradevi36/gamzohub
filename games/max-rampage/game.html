'use strict';
//====== Canvas & letterbox scaling ======//
const W = 1280, H = 720;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let viewScale = 1, viewOX = 0, viewOY = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.round(w * DPR); canvas.height = Math.round(h * DPR);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  viewScale = Math.min(w / W, h / H);
  viewOX = (w - W * viewScale) / 2; viewOY = (h - H * viewScale) / 2;
}
window.addEventListener('resize', resize);
resize();

//====== World constants ======//
const BASE_Y = 560, GRAVITY = 1500, FALL_Y = 1150;
const JUMP_BASE = 430, JUMP_EXTRA = 390, MAX_LAUNCH = 1120;
const OUT = '#1b1530';
const FONT = '"Arial Black", "Arial Bold", Impact, sans-serif';
const TAU = Math.PI * 2;

//====== Math helpers ======//
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const moveToward = (v, target, step) => (v < target ? Math.min(target, v + step) : Math.max(target, v - step));
const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
function hash(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function pick(arr, r) { return arr[Math.floor((r === undefined ? Math.random() : r) * arr.length) % arr.length]; }
function normAngle(a) { a = a % TAU; if (a > Math.PI) a -= TAU; if (a < -Math.PI) a += TAU; return a; }
function inRect(p, b) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), f = amt < 0 ? 1 + amt : 1, add = amt > 0 ? amt * 255 : 0;
  const c = v => clamp(Math.round(v * f + add), 0, 255);
  return 'rgb(' + c(n >> 16) + ',' + c((n >> 8) & 255) + ',' + c(n & 255) + ')';
}

function defaultSave() {
  return { unlocked: 1, stars: [0, 0, 0, 0, 0, 0, 0, 0, 0], best: [0, 0, 0, 0, 0, 0, 0, 0, 0], coins: 0, freeBest: 0,
    owned: { helmet_orange: 1, suit_teal: 1, ride_classic: 1, trail_none: 1 },
    equip: { helmet: 'orange', suit: 'teal', ride: 'classic', trail: 'none' }, difficulty: 1, muted: false };
}
function loadSave() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { const d = defaultSave(), s = JSON.parse(raw); return Object.assign(d, s, { equip: Object.assign(d.equip, s.equip), owned: Object.assign(d.owned, s.owned) }); } } catch (e) { /* storage blocked */ }
  return defaultSave();
}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* storage blocked */ } }
let save = loadSave();

//====== Input (keyboard + touch actions) ======//
const KEYMAP = { arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right', arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down', ' ': 'jump', spacebar: 'jump', z: 'spin', x: 'flip', c: 'grab', enter: 'enter', escape: 'pause', p: 'pause', m: 'mute' };
const input = { held: {}, pressed: {}, released: {} };
function press(a) { if (!input.held[a]) input.pressed[a] = true; input.held[a] = true; }
function release(a) { if (input.held[a]) input.released[a] = true; input.held[a] = false; }
function clearEdges() { input.pressed = {}; input.released = {}; pointer.clicked = false; pointer.moved = false; }
window.addEventListener('keydown', e => { const a = KEYMAP[e.key.toLowerCase()]; Sound.unlock(); if (a) { e.preventDefault(); if (!e.repeat) press(a); } });
window.addEventListener('keyup', e => { const a = KEYMAP[e.key.toLowerCase()]; if (a) { e.preventDefault(); release(a); } });
window.addEventListener('blur', () => { for (const k in input.held) release(k); });

//====== Pointer (mouse / multi-touch) ======//
const pointer = { x: -99, y: -99, clicked: false, moved: false, touch: false };
const touchHeld = {};
function toLogical(e) { return { x: (e.clientX - viewOX) / viewScale, y: (e.clientY - viewOY) / viewScale }; }
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); Sound.unlock();
  if (e.pointerType === 'touch' || e.pointerType === 'pen') pointer.touch = true;
  const p = toLogical(e); pointer.x = p.x; pointer.y = p.y; pointer.moved = true;
  const act = touchButtonAt(p.x, p.y);
  if (act) { touchHeld[e.pointerId] = act; press(act); } else pointer.clicked = true;
});
canvas.addEventListener('pointermove', e => { const p = toLogical(e); pointer.x = p.x; pointer.y = p.y; pointer.moved = true; });
const endPointer = e => { const a = touchHeld[e.pointerId]; if (a) { release(a); delete touchHeld[e.pointerId]; } };
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

//====== Sound (Web Audio SFX + surf-rock chiptune) ======//
const Sound = (() => {
  let ac = null, master, sfxBus, musicBus, noiseBuf, nextTime = 0, step = 0, started = false;
  function unlock() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      try { ac = new AC(); } catch (e) { return; }
      master = ac.createGain(); master.connect(ac.destination);
      sfxBus = ac.createGain(); sfxBus.gain.value = 0.5; sfxBus.connect(master);
      musicBus = ac.createGain(); musicBus.gain.value = 0.17; musicBus.connect(master);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      applyMute(); startMusic();
    }
    if (ac.state === 'suspended') ac.resume();
  }
  function applyMute() { if (master) master.gain.setValueAtTime(save.muted ? 0 : 1, ac.currentTime); }
  function tone(f, dur, type, vol, f2, at, bus) {
    if (!ac) return;
    const t0 = at, o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(bus || sfxBus); o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, vol, freq, at, bus, ftype) {
    if (!ac) return;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = ftype || 'lowpass'; f.frequency.value = freq || 1000;
    g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
    s.connect(f); f.connect(g); g.connect(bus || sfxBus); s.start(at, Math.random() * 0.5); s.stop(at + dur + 0.03);
  }
  const T = (f, dur, type, vol, f2, delay) => ac && tone(f, dur, type, vol, f2, ac.currentTime + (delay || 0));
  const N = (dur, vol, freq, ftype, delay) => ac && noise(dur, vol, freq, ac.currentTime + (delay || 0), null, ftype);
  const seq = (notes, dur, type, vol, gap) => notes.forEach((f, i) => T(f, dur, type, vol, 0, i * gap));
  const SFX = {
    jump: () => T(260, 0.16, 'square', 0.16, 620),
    bigjump: () => { T(200, 0.3, 'sawtooth', 0.14, 900); N(0.3, 0.15, 2500, 'bandpass'); },
    land: () => N(0.09, 0.35, 700),
    coin: () => { T(988, 0.07, 'square', 0.1); T(1319, 0.14, 'square', 0.1, 0, 0.06); },
    trick: () => T(500, 0.12, 'triangle', 0.25, 1000),
    whoosh: () => N(0.18, 0.12, 2200, 'bandpass'),
    perfect: () => seq([523, 659, 784, 1047], 0.12, 'square', 0.1, 0.06),
    crash: () => { N(0.5, 0.6, 600); T(220, 0.45, 'sawtooth', 0.2, 40); },
    bonk: () => T(180, 0.18, 'square', 0.22, 70),
    power: () => seq([392, 523, 659, 784, 1047], 0.1, 'square', 0.1, 0.05),
    click: () => T(700, 0.05, 'square', 0.1),
    blip: () => T(900 + Math.random() * 200, 0.03, 'square', 0.04),
    star: () => { T(1047, 0.2, 'triangle', 0.25); T(1568, 0.3, 'triangle', 0.2, 0, 0.08); },
    mega: () => seq([262, 330, 392, 523, 659, 784, 1047], 0.14, 'sawtooth', 0.1, 0.05),
    splash: () => N(0.25, 0.3, 1800, 'highpass'),
    bark: () => { T(420, 0.08, 'sawtooth', 0.14, 250); T(420, 0.08, 'sawtooth', 0.14, 250, 0.12); },
    near: () => T(880, 0.1, 'triangle', 0.2, 1320),
    grind: () => N(0.06, 0.06, 3000, 'highpass'),
    lose: () => seq([392, 330, 262, 196], 0.25, 'triangle', 0.2, 0.18),
    win: () => seq([523, 659, 784, 659, 784, 1047], 0.16, 'square', 0.12, 0.11)
  };
  //====== Music scheduler (152 BPM, E-A-B surf progression) ======//
  const EIGHTH = 60 / 152 / 2, CHORDS = [40, 40, 45, 45, 47, 45, 40, 47], BASS = [0, 0, 12, 0, 7, 0, 12, 7];
  const RIFF_A = [0, null, 3, 5, 7, null, 5, 3], RIFF_B = [12, 10, 7, null, 5, 7, 3, 0];
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  function playStep(s, t) {
    const bar = Math.floor(s / 8), i = s % 8, root = CHORDS[bar];
    tone(midi(root + BASS[i]), EIGHTH * 0.9, 'triangle', 0.34, 0, t, musicBus);
    const r = (bar % 2 ? RIFF_B : RIFF_A)[i];
    if (r !== null) tone(midi(root + 24 + r), EIGHTH * 0.7, 'square', 0.07, 0, t, musicBus);
    if (i === 0 || i === 4) tone(130, 0.12, 'sine', 0.6, 45, t, musicBus);
    if (i === 2 || i === 6) noise(0.12, 0.28, 1800, t, musicBus, 'bandpass');
    noise(0.03, 0.08, 6000, t, musicBus, 'highpass');
  }
  function sched() {
    if (!ac || ac.state !== 'running') return;
    if (nextTime < ac.currentTime - 0.3) nextTime = ac.currentTime + 0.05;
    while (nextTime < ac.currentTime + 0.12) { playStep(step, nextTime); nextTime += EIGHTH; step = (step + 1) % 64; }
  }
  function startMusic() { if (started) return; started = true; nextTime = ac.currentTime + 0.1; setInterval(sched, 25); }
  return { unlock, applyMute, play: name => { if (ac && SFX[name]) SFX[name](); } };
})();

//====== Level generator (seeded, data-driven) ======//
function genLevel(ep, seed, diffIdx) {

  const pickFeat = () => { let r = R() * total; for (const k of keys) { r -= ep.feats[k]; if (r <= 0) return k; } return keys[0]; };
  const wrenchAt = ep.length * (0.45 + R() * 0.2);
  if (ep.tutorial) L.hints = [
    { x: 350, k: 'Hold RIGHT to go faster, LEFT to slow down', t: 'Hold ▶ to go faster, ◀ to slow down' },
    { x: 850, k: 'Hold SPACE to charge, RELEASE to jump!', t: 'Hold JUMP to charge, RELEASE to jump!' },
    { x: 2500, k: 'In the air: Z = Spin, X = Flip, hold C = Grab', t: 'In the air: SPIN, FLIP, or hold GRAB' },
    { x: 4200, k: 'Use UP / DOWN in the air to level out for a PERFECT landing', t: 'Use ▲ / ▼ in the air to level out for a PERFECT landing' },
    { x: 5900, k: 'Release SPACE right at the ramp lip for MASSIVE air!', t: 'Release JUMP right at the ramp lip for MASSIVE air!' },
    { x: 7500, k: 'Chain tricks in ONE jump for a combo multiplier!', t: 'Chain tricks in ONE jump for a combo multiplier!' },
    { x: 9000, k: 'Fill the TRICK METER to unleash MEGA STUNT mode!', t: 'Fill the TRICK METER to unleash MEGA STUNT mode!' }

        const w = 230 + R() * 70, h = 80 + R() * 60;

        if (ep.hazards.indexOf('magnet') >= 0 && R() < 0.45) addHaz('magnet', x + w + vx * 0.5);
        x += w + 820; break;
      }
      case 'bigramp': {
        const w = 330, h = 175;

        if (!L.wrench) L.wrench = { x: x + w + vx * 0.7, y: y - h - 360, got: false };

      }
      case 'gap': {

        let gw = (170 + R() * 150) * D.gapMult, ny = y;
        if (ep.theme === 'rooftop') { ny = clamp(y + Math.round((R() * 2 - 1) * 70), 470, 610); if (ny < y) gw = Math.min(gw, 240); }

        x += HAZ[a].w + HAZ[b].w + 980; break;
      }
      case 'coins': { for (let i = 0; i < 6; i++) L.coins.push({ x: x + i * 55, y: y - 45 }); x += 380; break; }
      case 'bump': {

        for (let i = 1; i < 6; i++) { const t = i / 6; L.coins.push({ x: x + w * t, y: y - h * 0.5 * (1 - Math.cos(TAU * t)) - 50 }); }
        x += w + 300; break;
      }
      case 'rail': {
        const len = 420 + R() * 240, ry = y - 54;

    }

  if (ep.special === 'car') { const w = 300, h = 130; L.ramps.push({ x, w, h, y }); L.hazards.push({ type: 'car', x: x + w + 180, baseX: x + w + 180, y, t: 0, phase: 0, active: true, dad: true }); coinArc(x + w, y - h, vx * 2 * h / w + 300); x += w + 1100; }

  L.finishX = x + 200;

  L.props.push({ who: 'milo', x: L.finishX + 220, anim: 'cheer' });

}

//====== Ground queries (segments, ramps, bumps, rails) ======//
function segAt(x) {
  const S = G.level.segs;

  return null;
}
function surfY(x, s) {

  return y;
}

  const s = segAt(x); if (!s) return null;
  let y = s.y, slope = 0;
  for (const r of L.ramps) if (x >= r.x && x < r.x + r.w) { const t = (x - r.x) / r.w; return { y: y - r.h * t * t, slope: -2 * r.h * t / r.w, rail: false, seg: s, ramp: r }; }

}

  for (const r of L.ramps) if (x + 180 > r.x && x - 60 < r.x + r.w) return false;
  for (const b of L.bumps) if (x + 120 > b.x && x - 60 < b.x + b.w) return false;
  for (const r of L.rails) if (x + 120 > r.x0 && x - 40 < r.x1) return false;

}

  const p = G.p;
  G.playT += dt; G.slowFx = Math.max(0, G.slowFx - dt);
  const ts = (p.slow > 0 ? 0.55 : 1) * (G.slowFx > 0 ? 0.45 : 1), sdt = dt * ts;

function updateRider(dt, rdt) {

  p.invuln -= rdt; p.turbo -= rdt; p.shield -= rdt; p.slow -= rdt; p.puddle -= rdt;
  if (p.mega > 0) { p.mega -= rdt; if (p.mega <= 0) pop('MEGA OVER', p.x, p.y - 160, '#ccc', 24); }

  if (p.turbo > 0) target *= 1.55; if (p.mega > 0) target *= 1.2; if (p.puddle > 0) target *= 0.6;
  if (p.onGround) p.vx += (target - p.vx) * Math.min(1, 2.2 * dt); else p.vx += (G.speed - p.vx) * Math.min(1, 0.25 * dt);
  if (I.held.jump && (p.onGround || p.coyote > 0)) { p.charging = true; p.charge = Math.min(1, p.charge + dt / 0.55); }

//====== Landing & combo banking ======//

    if (s.air) h.ay = h.y - 215 + Math.sin(h.t * 1.6 + h.phase) * 85;
    if (!ride || !h.active) continue;

      if (s.slow) { if (p.onGround) { if (p.puddle <= 0) { Sound.play('splash'); burst(h.x, h.y - 5, 10, ['#4fc3f7', '#bfe9ff'], 'dot', 260, 700, 5); } p.puddle = 0.7; } continue; }
      if (p.mega > 0) { h.smashed = true; h.fx = 0; h.fy = 0; h.fvy = -650; h.frot = 0; if (h.type === 'gnome') h.hatless = true; pop('BAM!', h.x, h.y - 80, '#ff3df5', 40); Sound.play('bonk'); addScore(100); continue; }

//====== Finish & results ======//
function finishLevel() {

  if (i >= 0 && won) { save.stars[i] = Math.max(save.stars[i], stars); save.best[i] = Math.max(save.best[i], G.score); save.unlocked = Math.min(9, Math.max(save.unlocked, i + 2)); }

  Sound.play(won ? 'win' : 'lose');

}

  if (vis(L.finishX, 300)) drawFinish(L.finishX, groundInfo(L.finishX) ? groundInfo(L.finishX).y : BASE_Y, t);
  for (const h of L.hazards) if (vis(h.x)) drawHazard(h, t);
  for (const k of L.coins) if (!k.got && vis(k.x, 40)) drawCoin(k, t);
  for (const k of L.pickups) if (!k.got && vis(k.x, 60)) drawPickup(k, t);
  if (L.wrench && vis(L.wrench.x)) drawWrench(L.wrench, t);
  if (G.cop && vis(G.cop.x)) { const gi = groundInfo(G.cop.x); drawCop(G.cop.x, gi ? gi.y : p.refY, t); }
  if (G.rival) {
    const r = G.rival; ctx.save(); ctx.globalAlpha = 0.9; ctx.translate(r.x, r.y - 40); ctx.rotate(r.rot); ctx.translate(0, 40); ctx.scale(r.spinX, 1);
    drawRider({ vehicle: 'board', t, equip: { ride: 'chad' }, style: 'chad', pose: r.hop > 0 && r.trick === 'grab' ? 'grab' : 'ride' }); ctx.restore();
  }
  drawPlayer(p, t);
  drawParts(); drawPops();
  ctx.restore();
}
function drawPlayer(p, t) {
  const L = G.level, eq = save.equip;
  if (p.state === 'crash') {
    const r = p.rag;
    ctx.save(); ctx.translate(r.bx, r.by); ctx.rotate(r.br); drawRider({ vehicle: L.vehicle, t, equip: eq, part: 'vehicle', wheelRot: t * 20 }); ctx.restore();
    ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot); ctx.translate(0, 50); drawRider({ vehicle: 'board', t, equip: eq, part: 'body', pose: 'crash' }); ctx.restore();
    for (let i = 0; i < 4; i++) { const a = t * 6 + i * TAU / 4; star(r.x + Math.cos(a) * 34, r.y - 50 + Math.sin(a) * 10, 8, '#ffe14d', 2); }
    return;
  }
  const tv = trickVisual(p), ang = p.onGround ? Math.atan(p.slope) : p.pitch + tv.rot;
  ctx.save(); ctx.translate(p.x, p.y - 40); ctx.rotate(ang); ctx.translate(0, 40);
  ctx.scale(tv.spinX, 1); ctx.scale(1 + (1 - p.squash) * 0.5, p.squash);
  if (p.invuln > 0 && Math.floor(G.playT * 20) % 2) ctx.globalAlpha = 0.45;
  if (p.shield > 0) { ctx.globalAlpha *= 0.35; circ(0, -55, 66, '#7ec8ff', 0); ctx.globalAlpha = p.invuln > 0 && Math.floor(G.playT * 20) % 2 ? 0.45 : 1; }
  if (p.mega > 0) { ctx.save(); ctx.globalAlpha = 0.45; circ(0, -55, 70 + Math.sin(t * 20) * 6, 'hsl(' + ((t * 400) % 360) + ',100%,60%)', 0); ctx.restore(); }
  drawRider({ vehicle: L.vehicle, t, equip: eq, style: 'max', crouch: p.charging ? p.charge : p.grab ? 1 : 0, pose: p.grab ? 'grab' : 'ride', pedal: p.x * 0.05, wheelRot: p.x * 0.05 });
  ctx.restore();
  if (p.charging && p.charge > 0.05) { rr(p.x - 30, p.y - 140, 60, 10, 5); fs('rgba(27,21,48,0.6)', 2); rr(p.x - 28, p.y - 138, 56 * p.charge, 6, 3); fs(p.charge > 0.95 ? '#ff4757' : '#ffd23f', 0); }
}
function drawHelmetIcon(x, y, on) { ctx.beginPath(); ctx.arc(x, y + 6, 16, Math.PI, TAU); ctx.closePath(); fs(on ? (HELMETS[save.equip.helmet] || HELMETS.orange) : '#666', 3); if (on) poly([x - 3, y - 7, x + 2, y - 7, x, y - 2, x + 4, y - 2, x - 3, y + 5, x - 1, y, x - 5, y], '#ffe14d', 1.5); }
function drawHUD() {
  const p = G.p, ep = G.ep;
  txt(String(G.score), 30, 40, 42, '#ffe14d', 'left', 8);
  circ(42, 86, 12, '#ffd23f', 3); txt('× ' + G.coinsRun, 62, 87, 24, '#fff', 'left', 5);
  for (let i = 0; i < G.maxLives; i++) drawHelmetIcon(W - 40 - i * 42, 36, i < G.lives);
  //====== Trick meter ======//
  rr(440, 18, 400, 26, 13); fs('rgba(27,21,48,0.6)', 4);
  if (p.mega > 0) { rr(443, 21, 394 * (p.mega / 5), 20, 10); fs('hsl(' + ((G.t * 400) % 360) + ',100%,60%)', 0); txt('MEGA STUNT!', 640, 32, 18, '#fff', 'center', 4); }
  else { if (G.meter > 0.01) { rr(443, 21, 394 * G.meter, 20, 10); fs('#ff3df5', 0); } txt('TRICK METER', 640, 32, 16, '#fff', 'center', 4); }
  //====== Live combo ======//
  const names = p.airTricks.map(a => a.name); if (p.trick) names.push(p.trick.def.name + '…'); if (p.grab) names.push(p.grab.name + '…'); if (p.grinding) names.push('Rail Grind…');
  if (names.length && p.state === 'ride') { txt(names.join(' + '), 640, 72, 22, '#fff', 'center', 5); if (p.airTricks.length > 1) txt('x' + p.airTricks.length, 640, 104, 34, '#7CFF6B', 'center', 6); }
  //====== Mode-specific readouts ======//
  if (G.rival) { const ahead = G.score > G.rival.score; rr(870, 60, 250, 40, 12); fs('rgba(27,21,48,0.65)', 3); txt('CHAD ' + G.rival.score, 995, 81, 22, ahead ? '#b388ff' : '#ff4757', 'center', 0); }
  if (G.challenge) { rr(440, 120, 400, 46, 12); fs('#7b3fe4', 4); txt('DO: ' + G.challenge.name.toUpperCase() + '  ' + Math.ceil(G.challenge.t) + 's', 640, 144, 22, '#fff', 'center', 4); }
  if (G.cop) { const d = Math.max(0, Math.round((p.x - G.cop.x) / 10)); rr(870, 60, 250, 40, 12); fs('rgba(27,21,48,0.65)', 3); txt('DUNN: ' + d + 'm', 995, 81, 22, d < 25 ? '#ff4757' : '#7ef0ff', 'center', 0); }
  if (ep.sunset) { rr(870, 60, 250, 40, 12); fs('rgba(27,21,48,0.65)', 3); txt('SUNSET ' + Math.max(0, Math.ceil(G.timer)) + 's', 995, 81, 22, G.timer < 10 ? '#ff4757' : '#ffd23f', 'center', 0); }
  if (p.turbo > 0) txt('TURBO', 30, 125, 20, '#ff4757', 'left', 4);
  if (p.shield > 0) txt('SHIELD', 120, 125, 20, '#3b8bff', 'left', 4);
  if (p.slow > 0) txt('SLOW-MO', 215, 125, 20, '#a259ff', 'left', 4);
  //====== Progress bar ======//
  const k = clamp(p.x / G.level.finishX, 0, 1);
  rr(340, 698, 600, 10, 5); fs('rgba(27,21,48,0.6)', 2); rr(340, 698, 600 * k, 10, 5); fs('#1fb5a8', 0);
  circ(340 + 600 * k, 703, 10, HELMETS[save.equip.helmet] || HELMETS.orange, 3);
  if (G.rival) circ(340 + 600 * clamp(G.rival.x / G.level.finishX, 0, 1), 703, 7, '#7b3fe4', 2);
  txt('🏁', 955, 700, 18, '#fff', 'left', 0);
  //====== Quip bubble ======//
  if (G.quip) {
    const q = G.quip, a = Math.min(1, q.t * 6, (3.2 - q.t) * 4);
    ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
    const lines = wrap(q.text, 380, 20), bh = 24 + lines.length * 26;
    rr(100, 150, 420, bh, 16); fs('#fff', 4);
    lines.forEach((l, i) => txt(l, 116, 164 + 12 + i * 26, 20, OUT, 'left', 0));
    circ(62, 150 + bh / 2, 36, PEOPLE[q.who].bg, 4); drawFace(q.who, q.expr, 62, 150 + bh / 2 + 2, 28);
    ctx.restore();
  }
  //====== Tutorial hint & intro banner ======//
  if (G.hint) { const a = clamp(Math.min(G.hint.t * 4, (4.5 - G.hint.t) * 3), 0, 1); ctx.globalAlpha = a; rr(240, 632, 800, 50, 16); fs('rgba(27,21,48,0.85)', 4); txt(G.hint.text, 640, 657, 22, '#ffe14d', 'center', 0); ctx.globalAlpha = 1; }
  if (G.playT < 2.2) { const a = clamp(Math.min(G.playT * 4, (2.2 - G.playT) * 3), 0, 1); ctx.globalAlpha = a; txt(ep.free ? 'FREE RIDE!' : ep.name.toUpperCase(), 640, 300, 52, '#ffe14d', 'center', 10); txt('GO GO GO!', 640, 360, 30, '#fff', 'center', 6); ctx.globalAlpha = 1; }
  if (p.state === 'crash' && p.crashT > 0.9) { ctx.save(); ctx.translate(640, 330); ctx.rotate(-0.3); rr(-70, -22, 140, 44, 14); fs('#ffd9b0', 4); rr(-22, -22, 44, 44, 6); fs('#ffe9d2', 3); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) circ(-10 + i * 10, -10 + j * 10, 2, '#d4a77a', 0); ctx.restore(); txt('OUCH!', 640, 400, 32, '#fff', 'center', 6); }
  drawTouch();
}
function drawSpeedLines() {
  const p = G.p; if (p.state !== 'ride' || !(p.turbo > 0 || p.mega > 0 || p.vx > G.speed * 1.25)) return;
  ctx.globalAlpha = 0.5;
  for (let i = 0; i < 14; i++) { const y = hash(i + Math.floor(G.t * 20)) * H, x = ((G.t * 2400 + i * 233) % (W + 300)); line([W - x, y, W - x + 120, y], '#fff', 3); }
  ctx.globalAlpha = 1;
}
function drawPlay() { drawBackground(G.level.theme, G.cam.x, G.cam.y, G.t); drawWorld(); drawSpeedLines(); drawHUD(); }

//====== Overlays: pause, results, game over ======//
function pauseButtons() {
  const x = 460, w = 360, h = 60;
  return [
    { x, y: 250, w, h, label: 'RESUME', action: () => setState('play') },
    { x, y: 325, w, h, label: 'RESTART', action: () => { resetRun(); setState('play'); } },
    { x, y: 400, w, h, label: 'SOUND: ' + (save.muted ? 'OFF' : 'ON'), action: () => { save.muted = !save.muted; writeSave(); Sound.applyMute(); } },
    { x, y: 475, w, h, label: G.epIndex >= 0 ? 'STORY MAP' : 'MAIN MENU', action: () => setState(G.epIndex >= 0 ? 'map' : 'title') }
  ];
}
function overlay(title, color) { ctx.fillStyle = 'rgba(15,10,35,0.6)'; ctx.fillRect(0, 0, W, H); rr(330, 70, 620, 590, 30); fs('#fff', 7); txt(title, 640, 140, 54, color, 'center', 10); }
function resultButtons() {
  const r = G.results, i = G.epIndex, list = [];
  if (G.ep.free) { list.push({ label: 'RIDE AGAIN', action: () => startEpisode(-1) }, { label: 'MAIN MENU', action: () => setState('title') }); }
  else {
    if (r.won && i < 8) list.push({ label: 'NEXT EPISODE', action: () => startEpisode(i + 1) });
    list.push({ label: 'RETRY', action: () => startEpisode(i) }, { label: 'STORY MAP', action: () => setState('map') });
  }
  return list.map((b, k) => Object.assign(b, { x: 460, y: 455 + k * 66, w: 360, h: 56, size: 24 }));
}
function drawResults() {
  drawPlay(); const r = G.results; r.t += 1 / 60;
  const fin = G.epIndex === 8 && r.won;
  overlay(G.ep.free ? 'RIDE COMPLETE!' : r.won ? (fin ? 'STUNT LEGEND!' : 'EPISODE COMPLETE!') : 'SO CLOSE!', r.won ? '#1fb5a8' : '#ff4757');
  if (!G.ep.free) for (let s = 0; s < 3; s++) {
    const on = s < r.stars && r.t > 0.5 + s * 0.4, k = on ? Math.min(1.2, (r.t - 0.5 - s * 0.4) * 6) : 1;
    if (on && !r['s' + s]) { r['s' + s] = true; Sound.play('star'); }
    ctx.save(); ctx.translate(540 + s * 100, 225); ctx.scale(k > 1 ? 2.2 - k : k, k > 1 ? 2.2 - k : k); star(0, 0, 38, on ? '#ffd23f' : '#e3e6eb', 5); ctx.restore();
  }
  const shown = Math.round(G.score * Math.min(1, r.t / 1.2));
  txt('SCORE ' + shown, 640, 300, 40, OUT, 'center', 0);
  const info = [];
  if (G.rival) info.push('YOU ' + G.score + '  vs  CHAD ' + G.rival.score);
  if (!r.won && r.reason) info.push(r.reason);
  info.push('Coins +' + G.coinsRun + '     Golden Wrench ' + (G.wrench ? '✔' : '✘'));
  if (G.bestCombo) info.push('Best: ' + G.bestCombo.names.slice(0, 4).join(' + ') + ' = ' + G.bestCombo.pts);
  if (G.ep.free) info.push(r.newBest ? 'NEW BEST!' : 'Best ' + save.freeBest);
  else if (r.won) info.push('Goal ' + G.ep.goal + ' • 3rd ★: wrench + 3-trick combo');
  info.forEach((s, k) => { const ls = wrap(s, 560, 18); txt(ls[0], 640, 345 + k * 26, 18, '#444', 'center', 0); });
  if (fin && Math.random() < 0.3) burst(Math.random() * W, -10, 2, TRAIL_COLORS.rainbow, 'confetti', 100, 300, 6);
  drawButtons(resultButtons());
}
function drawGameOver() {
  drawPlay();
  overlay('WIPEOUT CITY!', '#ff4757');
  drawFace('milo', 'scared', 640, 280, 70);
  txt(G.results.reason, 640, 385, 22, OUT, 'center', 0);
  txt('Score ' + G.score + '   •   Coins +' + G.coinsRun, 640, 420, 20, '#555', 'center', 0);
  drawButtons(gameOverButtons());
}
function gameOverButtons() { return [{ x: 460, y: 470, w: 360, h: 60, label: 'TRY AGAIN', action: () => { if (G.epIndex >= 0) startEpisode(G.epIndex); else startEpisode(-1); } }, { x: 460, y: 548, w: 360, h: 60, label: G.epIndex >= 0 ? 'STORY MAP' : 'MAIN MENU', action: () => setState(G.epIndex >= 0 ? 'map' : 'title') }]; }

//====== Update & draw dispatch ======//
function update(dt) {
  G.clock += dt; G.stateT += dt;
  if (G.resetArm > 0) G.resetArm -= dt;
  if (input.pressed.mute) { save.muted = !save.muted; writeSave(); Sound.applyMute(); }
  switch (G.state) {
    case 'title': menu(titleButtons()); break;
    case 'map': if (input.pressed.pause) setState('title'); else menu(mapButtons()); break;
    case 'garage': if (input.pressed.pause) setState(G.garageBack || 'title'); else menu(garageButtons()); break;
    case 'settings': if (input.pressed.pause) setState(G.settingsBack || 'title'); else menu(settingsButtons()); break;
    case 'cutscene': updateCutscene(dt); break;
    case 'play': updatePlay(dt); break;
    case 'pause': if (input.pressed.pause) setState('play'); else menu(pauseButtons()); break;
    case 'results': if (G.results.t > 0.6) menu(resultButtons()); break;
    case 'gameover': if (G.stateT > 0.6) menu(gameOverButtons()); break;
  }
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0b0820'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(DPR * viewScale, 0, 0, DPR * viewScale, DPR * viewOX, DPR * viewOY);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  switch (G.state) {
    case 'title': drawTitle(); break;
    case 'map': drawMap(); break;
    case 'garage': drawGarage(); break;
    case 'settings': drawSettings(); break;
    case 'cutscene': if (G.cut.next === 'results') { drawPlay(); ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0, 0, W, H); } drawCutscene(); break;
    case 'play': drawPlay(); break;
    case 'pause': drawPlay(); overlay('PAUSED', '#1fb5a8'); txt('Controls: ←/→ speed • SPACE jump • Z/X/C tricks • ↑/↓ balance', 640, 590, 16, '#555', 'center', 0); drawButtons(pauseButtons()); break;
    case 'results': drawResults(); break;
    case 'gameover': drawGameOver(); break;
  }
  ctx.restore();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') setState('pause'); });

//====== Main loop (fixed 60 FPS timestep) ======//
const STEP = 1 / 60;
let lastTime = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.25, (now - lastTime) / 1000); lastTime = now;
  let steps = 0;
  while (acc >= STEP && steps < 5) { update(STEP); clearEdges(); acc -= STEP; steps++; }
  if (steps === 5) acc = 0;
  try { draw(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { G, startEpisode, setState, input, press, release, save: () => save, step: n => { for (let i = 0; i < n; i++) { update(STEP); clearEdges(); } } };
</script>
